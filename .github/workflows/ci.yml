name: Compilar probar y entregar

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version privada opcional, por ejemplo v1.0.0'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  validar:
    name: Compilacion y pruebas
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Verificar bloques de codigo CA14
        shell: powershell
        run: |
          .\scripts\VerificarEstilo.ps1 | Tee-Object -FilePath verificacion-estilo.txt
          if ($LASTEXITCODE -ne 0)
          {
            exit $LASTEXITCODE
          }
      - name: Compilar solucion
        run: msbuild GestionIncidencias.sln /t:Rebuild /p:Configuration=Release /p:UseSharedCompilation=false /m:1 /nr:false /warnaserror /v:minimal
      - name: Ejecutar pruebas
        shell: pwsh
        run: |
          & .\Pruebas\bin\Release\Pruebas.exe | Tee-Object -FilePath pruebas.txt
          if ($LASTEXITCODE -ne 0)
          {
            exit $LASTEXITCODE
          }
      - name: Preparar paquete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path paquete -Force | Out-Null
          Copy-Item -LiteralPath .\GestionIncidencias\bin\Release\GestionIncidencias.exe -Destination paquete
          Copy-Item -LiteralPath pruebas.txt -Destination paquete
          Copy-Item -LiteralPath verificacion-estilo.txt -Destination paquete
          Compress-Archive -Path .\paquete\* -DestinationPath GestionIncidencias.zip
      - name: Guardar entrega validada
        uses: actions/upload-artifact@v7
        with:
          name: GestionIncidencias-${{ github.sha }}
          path: GestionIncidencias.zip
          if-no-files-found: error
          retention-days: 14

  publicar:
    name: Distribuir version etiquetada
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: validar
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Recuperar paquete validado
        uses: actions/download-artifact@v4
        with:
          name: GestionIncidencias-${{ github.sha }}
      - name: Publicar release privada
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_ENTREGA: ${{ inputs.version }}
        shell: pwsh
        run: |
          $versionEntrega = $env:VERSION_ENTREGA
          if ($versionEntrega -eq '')
          {
            $versionEntrega = $env:GITHUB_REF_NAME
          }
          if ($versionEntrega -notmatch '^v\d+\.\d+\.\d+$')
          {
            throw 'La version debe tener el formato v1.0.0.'
          }
          gh release create "$versionEntrega" GestionIncidencias.zip --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Gestion de incidencias $versionEntrega" --notes "Version compilada y probada por GitHub Actions. Requiere Windows y .NET Framework 4.7.2 o superior."
          if ($LASTEXITCODE -ne 0)
          {
            exit $LASTEXITCODE
          }
